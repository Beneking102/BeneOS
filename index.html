<body>
<canvas id="matrix"></canvas>
<div id="scanlines"></div>

<div id="boot">
  <pre id="boot-log"></pre>
  <div id="boot-end">
    <div id="bootlogo">BENE<span>OS</span></div>
    <div id="bootbar"><i></i></div>
    <div id="boot-hint">Klicken zum Überspringen</div>
  </div>
</div>

<div id="login" hidden>
  <div id="lclock"><b></b><span></span></div>
  <div class="lbox" id="lbox">
    <div class="ring"><div class="avatar" id="lavatar">B</div></div>
    <h1>BENE<span class="dim">OS</span></h1>
    <div class="dim" id="lsub">Wähle ein Konto</div>
    <div class="users" id="lusers">
      <button class="utile" data-u="guest"><span>👤</span><b>Gast</b><small>ohne Passwort</small></button>
      <button class="utile" data-u="owner"><span>🛡️</span><b>Benedikt</b><small>Owner · geschützt</small></button>
      <button class="utile" data-u="other"><span>⌨</span><b>Anderer</b><small>Benutzer eingeben</small></button>
    </div>
    <form id="login-form" autocomplete="off" hidden>
      <input class="field" id="lu" aria-label="Benutzername" placeholder="Benutzername" spellcheck="false">
      <input class="field" id="lp" type="password" aria-label="Passwort" placeholder="Passwort">
      <div class="opbar" style="justify-content:center"><button class="btn" type="submit">Anmelden ▶</button><button class="btn" type="button" id="lback">Zurück</button></div>
    </form>
    <div id="lauth" hidden><pre id="lauth-log"></pre><div class="bar"><div id="lauth-bar"></div></div></div>
    <div id="lmsg" role="alert"></div>
    <div class="dim" id="lhint" style="font-size:12px"></div>
  </div>
</div>

<main id="desktop" hidden>
  <div id="icons"></div>
  <button id="badge" hidden aria-label="Zertifikate öffnen"></button>
  <div id="windows"></div>
</main>
<div id="snap" hidden></div>

<div id="startmenu" hidden></div>

<footer id="taskbar" hidden>
  <button id="start-btn">⏻ BENE<span>OS</span></button>
  <div id="tasks"></div>
  <div id="tray"><span id="tray-net">◉ ONLINE</span><button id="clock" aria-label="Kalender"></button></div>
</footer>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#00f0ff;background:#000;font-family:monospace">BeneOS braucht JavaScript.</p></noscript>
<script src="repos-fallback.js"></script>
<script src="wallpaper.js"></script>
<script src="sounds.js"></script>
<script src="lab.js"></script>
<script src="lab2.js"></script>
<script src="apps1.js"></script>
<script src="tools.js"></script>
<script src="live.js"></script>
<script src="os.js"></script>
<script src="login.js"></script>
<script src="shell.js"></script>
<script src="shell2.js"></script>
</body>
</html>
