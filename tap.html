<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a07">
<title>BeneOS // Tap</title>
<meta name="robots" content="noindex">
<style>
  :root { --g: #39ff7a; --bg: #050a07; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--g); font: 15px/1.5 ui-monospace, Consolas, monospace; }
  main { min-height: 100%; padding: 20px 16px; display: flex; flex-direction: column; justify-content: center; max-width: 560px; margin: 0 auto; }
  #log { white-space: pre-wrap; min-height: 14em; text-shadow: 0 0 6px rgba(57,255,122,.6); }
  .bar { height: 8px; border: 1px solid var(--g); margin: 14px 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--g); transition: width .2s; }
  #done { display: none; text-align: center; }
  #done h1 { font-size: 22px; margin: 0 0 6px; }
  #done p { margin: 4px 0 18px; opacity: .8; }
  .btn { display: block; margin: 8px 0; padding: 14px; border: 1px solid var(--g); color: var(--g); text-decoration: none; text-align: center; }
  .btn:active { background: var(--g); color: var(--bg); }
  #count b { font-size: 20px; }
  .skip { position: fixed; top: 10px; right: 12px; opacity: .5; font-size: 12px; color: var(--g); }
</style>
</head>
<body>
<a class="skip" href="/">überspringen &gt;</a>
<main>
  <div id="log"></div>
  <div class="bar"><i id="prog"></i></div>
  <div id="done">
    <h1>Gehackt. (Spaß.)</h1>
    <p>Zum Glück war es nur eine Animation – ich bin einer von den Guten.</p>
    <p id="count"></p>
    <a class="btn" href="/">&gt; BeneOS öffnen (Portfolio)</a>
    <a class="btn" href="https://github.com/Beneking102">&gt; GitHub: Beneking102</a>
  </div>
</main>
<script src="tap.js"></script>
</body>
</html>
